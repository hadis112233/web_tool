name: Audit external links

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check external links
        run: node scripts/check-external-links.mjs
      - name: Upload link report
        uses: actions/upload-artifact@v4
        with:
          name: link-audit-report
          path: reports/link-audit.md
          if-no-files-found: error
