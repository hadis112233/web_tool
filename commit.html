    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            line-height: 1.15;
            -webkit-text-size-adjust: 100%;

        body {
            margin: 0;
            background: #f5f7fa;
            color: #4b5563;
            font-family: "SF Pro SC", "SF Pro Text", "PingFang SC", "Microsoft Yahei", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        h1, h3, p {

        button, input, select, textarea {
            color: inherit;

        .sr-only {
            position: absolute;
            width: 1px;

            max-width: 800px;

<body class="io-grey-mode">
    <div class="submit-container">
        <div class="submit-header">
            <h1><i class="fas fa-paper-plane"></i> 网址提交</h1>
            <p>提交您的优质网站，我们将在审核后收录到网址导航中</p>
        </div>

        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> 提交成功！我们会尽快审核您的网站。
        </div>

        <div class="guidelines">
            <h3><i class="fas fa-info-circle"></i> 提交须知</h3>
            <ul>
                <li>请确保网站内容合法、健康，符合相关法律法规</li>
                <li>网站应正常访问，不含恶意代码或病毒</li>
                <li>提供真实有效的网站信息，便于我们审核</li>
                <li>我们会在3-5个工作日内完成审核，审核结果将通过邮件通知</li>
            </ul>
        </div>

        <form id="submitForm">
            <div class="sr-only" aria-hidden="true">
                <label for="company">公司</label>
                <input type="text" id="company" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
            </div>
            <div class="form-group">
                <label for="siteName">
                    网站名称<span class="required">*</span>
                </label>
                <input type="text" id="siteName" name="siteName" class="form-control"
                       placeholder="请输入网站名称" maxlength="50" aria-describedby="siteNameError" required>
                <div class="error-message" id="siteNameError" role="alert">请输入网站名称</div>
            </div>

            <div class="form-group">
                <label for="siteUrl">
                    网站地址<span class="required">*</span>
                </label>
                <input type="url" id="siteUrl" name="siteUrl" class="form-control"
                       placeholder="https://example.com" aria-describedby="siteUrlError" required>
                <div class="error-message" id="siteUrlError" role="alert">请输入正确的网址格式</div>
            </div>

            <div class="form-group">
                <label for="category">
                    网站分类<span class="required">*</span>
                </label>
                <select id="category" name="category" class="form-control" aria-describedby="categoryError" required>
                    <option value="">请选择分类</option>
                    <!-- SUBMIT_CATEGORIES_START -->
                    <option value="常用工具">常用工具</option>
                    <option value="云服务器">云服务器</option>
                    <option value="办公学习">办公学习</option>
                    <option value="影音视频">影音视频</option>
                    <option value="网盘资源">网盘资源</option>
                    <option value="图标素材">图标素材</option>
                    <option value="图标设计">图标设计</option>
                    <option value="平面素材">平面素材</option>
                    <option value="字体资源">字体资源</option>
                    <option value="PPT资源">PPT资源</option>
                    <option value="图形创意">图形创意</option>
                    <option value="界面设计">界面设计</option>
                    <option value="在线配色">在线配色</option>
                    <option value="迷你工具">迷你工具</option>
                    <option value="谷歌插件">谷歌插件</option>
                    <option value="资讯书籍">资讯书籍</option>
                    <option value="博客论坛">博客论坛</option>
                    <option value="设计规范">设计规范</option>
                    <option value="视频教程">视频教程</option>
                    <option value="其他">其他</option>
                    <!-- SUBMIT_CATEGORIES_END -->
                </select>
                <div class="error-message" id="categoryError" role="alert">请选择网站分类</div>
            </div>

            <div class="form-group">
                <label for="description">
                    网站描述<span class="required">*</span>
                </label>
                <textarea id="description" name="description" class="form-control"
                          placeholder="简要描述网站的主要功能和特点"
                          maxlength="200" aria-describedby="descCount descriptionError" required></textarea>
                <div class="char-count">
                    <span id="descCount">0</span>/200
                </div>
                <div class="error-message" id="descriptionError" role="alert">请输入网站描述</div>
            </div>

            <div class="form-group">
                <label for="keywords">
                    关键词
                </label>
                <input type="text" id="keywords" name="keywords" class="form-control"
                       placeholder="用逗号分隔，如：工具,在线,免费" maxlength="100">
            </div>

            <div class="form-group">
                <label for="email">
                    联系邮箱<span class="required">*</span>
                </label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="用于接收审核结果通知" aria-describedby="emailError" required>
                <div class="error-message" id="emailError" role="alert">请输入正确的邮箱地址</div>
            </div>

            <div class="form-group">
                <label for="contact">
                    联系方式
                </label>
                <input type="text" id="contact" name="contact" class="form-control"
                       placeholder="QQ、微信或其他联系方式（选填）" maxlength="50">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-paper-plane"></i> 提交网站
            </button>
            <p class="submit-notice">提交后将打开你的邮件客户端；请确认内容后发送给站长。未发送前不会上传任何资料。</p>
            <div class="submit-result" id="submitResult" role="status" aria-live="polite"></div>
        </form>

        <div class="back-home">
            <a href="/"><i class="fas fa-home"></i> 返回首页</a>
        </div>
    </div>

    <script defer src="./assets/js/commit-page.js?v=20260729-2"></script>
